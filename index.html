<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Project</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a73e8, #6c35de);
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 4rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 480px;
      width: 90%;
    }
    h1 {
      color: #1a73e8;
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }
    p {
      color: #666;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: linear-gradient(135deg, #1a73e8, #6c35de);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to my project</h1>
    <p>This is a simple project page built with HTML and CSS.</p>
    <button>Get Started</button>
  </div>
</body>
</html>
