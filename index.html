<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olusola Aiki</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a73e8, #6c35de);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Hero Section */
    .hero {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 3.5rem 4rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 520px;
      width: 100%;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8, #6c35de);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      margin: 0 auto 1.5rem;
    }

    h1 {
      color: #1a1a1a;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: #1a73e8;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    p {
      color: #666;
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #1a73e8, #6c35de);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 2.4rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.4);
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(26, 115, 232, 0.5);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.3);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.15);
      letter-spacing: 0.02em;
    }

    footer a {
      color: #fff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <div class="card">
      <div class="avatar">O</div>
      <h1>Olusola Aiki</h1>
      <p class="tagline">Builder &bull; Learner &bull; Creator</p>
      <p>Hi, I'm Olusola — a curious builder learning to create things on the web. This is my personal space where I share my projects and ideas.</p>
      <a href="#" class="btn">View My Project</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Olusola Aiki &mdash; Built with HTML &amp; CSS</p>
  </footer>

</body>
</html>
